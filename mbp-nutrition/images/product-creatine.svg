<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="MBP Micronized Creatine Monohydrate 300g Jar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECEFF3"/>
    </linearGradient>
    <linearGradient id="jarBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="28%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F9FAFB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111315"/>
      <stop offset="35%" stop-color="#2B3036"/>
      <stop offset="100%" stop-color="#1A1D20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1A1D20" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="320" cy="408" rx="135" ry="18" fill="#1A1D20" opacity="0.12"/>
  <g filter="url(#shadow)">
    <!-- Jar Body -->
    <rect x="200" y="135" width="240" height="262" rx="22" fill="url(#jarBody)" stroke="#D1D5DB" stroke-width="1.5"/>
    <!-- Lid -->
    <rect x="192" y="88" width="256" height="54" rx="14" fill="url(#lid)"/>
    <rect x="192" y="132" width="256" height="7" fill="#10B981"/>
    <!-- Label Band -->
    <rect x="200" y="175" width="240" height="190" fill="#1A1D20"/>
    <rect x="200" y="175" width="240" height="8" fill="#10B981"/>
    <rect x="200" y="357" width="240" height="6" fill="#F97316"/>
    <!-- Typography -->
    <text x="320" y="216" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="2">MBP</text>
    <text x="320" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" fill="#10B981" letter-spacing="3">NUTRITION</text>
    <line x1="255" y1="250" x2="385" y2="250" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="278" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="19" fill="#FFFFFF">MICRONIZED</text>
    <text x="320" y="302" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="19" fill="#10B981">CREATINE</text>
    <text x="320" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="11" fill="#D1D5DB">200-MESH MONOHYDRATE • UNFLAVORED</text>
    <rect x="268" y="334" width="104" height="18" rx="9" fill="#F97316"/>
    <text x="320" y="346.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">300g • 100 SERVINGS</text>
  </g>
  <!-- Clean scoop accent -->
  <g transform="translate(458, 338) rotate(-18)">
    <rect x="0" y="28" width="66" height="8" rx="4" fill="#10B981"/>
    <path d="M-24 12 h34 a8 8 0 0 1 8 8 v20 a12 12 0 0 1 -12 12 h-26 a12 12 0 0 1 -12 -12 v-20 a8 8 0 0 1 8 -8z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>
</svg>
